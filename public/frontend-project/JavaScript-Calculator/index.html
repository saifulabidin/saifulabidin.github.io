<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Calculator | Saiful Abidin</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calculator-container">
    <header class="app-header">
      <a href="../index.html" class="nav-back-btn">
        <i class="fas fa-arrow-left"></i> Hub
      </a>
      <span class="app-badge">FCC Project</span>
      <a href="https://codepen.io/saifulabidin/pen/emmrJKo" target="_blank" rel="noopener noreferrer" class="nav-code-btn">
        <i class="fab fa-codepen"></i> Code
      </a>
    </header>

    <h1 class="app-title">JavaScript Calculator</h1>
    
    <main class="calculator">
      <div class="display-container">
        <div class="formula">0</div>
        <div id="display" class="result">0</div>
      </div>
      
      <div class="buttons-grid">
        <button id="clear" class="btn btn-clear span-two">AC</button>
        <button id="divide" class="btn btn-operator" aria-label="Divide">/</button>
        <button id="multiply" class="btn btn-operator" aria-label="Multiply">×</button>
        
        <button id="seven" class="btn">7</button>
        <button id="eight" class="btn">8</button>
        <button id="nine" class="btn">9</button>
        <button id="subtract" class="btn btn-operator" aria-label="Subtract">-</button>
        
        <button id="four" class="btn">4</button>
        <button id="five" class="btn">5</button>
        <button id="six" class="btn">6</button>
        <button id="add" class="btn btn-operator" aria-label="Add">+</button>
        
        <button id="one" class="btn">1</button>
        <button id="two" class="btn">2</button>
        <button id="three" class="btn">3</button>
        <button id="equals" class="btn btn-equals span-row-two" aria-label="Calculate">=</button>
        
        <button id="zero" class="btn span-two">0</button>
        <button id="decimal" class="btn" aria-label="Decimal">.</button>
      </div>
    </main>
    
    <footer class="watermark">
      <p>Created by <a href="https://sabidzpro.is-a.dev" target="_blank">Saiful Abidin</a></p>
    </footer>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
