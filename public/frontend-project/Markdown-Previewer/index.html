<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Previewer | Saiful Abidin</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <!-- Load marked from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="../index.html" class="nav-back-btn">
        <i class="fas fa-arrow-left"></i> Hub
      </a>
      <span class="app-badge">FCC Project</span>
      <a href="https://codepen.io/saifulabidin/pen/dPPeYbj" target="_blank" rel="noopener noreferrer" class="nav-code-btn">
        <i class="fab fa-codepen"></i> Code
      </a>
    </header>

    <h1 class="app-title">Markdown Previewer</h1>
    
    <main class="panes-container">
      <!-- Editor Section -->
      <section class="editor-container" id="editor-container">
        <div class="toolbar toolbar-editor">
          <div class="toolbar-label">
            <i class="fas fa-edit"></i>
            <h2>Editor</h2>
          </div>
          <button id="editor-toggle" class="toggle-btn" aria-label="Toggle editor full view">
            <svg id="editor-maximize" class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            <svg id="editor-minimize" class="icon hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 14 10 14 10 20"></polyline>
              <polyline points="20 10 14 10 14 4"></polyline>
              <line x1="14" y1="10" x2="21" y2="3"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          </button>
        </div>
        <textarea id="editor" aria-label="Markdown Editor Input" spellcheck="false"></textarea>
      </section>
      
      <!-- Preview Section -->
      <section class="preview-container" id="preview-container">
        <div class="toolbar toolbar-preview">
          <div class="toolbar-label">
            <i class="fas fa-eye"></i>
            <h2>Preview</h2>
          </div>
          <button id="preview-toggle" class="toggle-btn" aria-label="Toggle preview full view">
            <svg id="preview-maximize" class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            <svg id="preview-minimize" class="icon hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 14 10 14 10 20"></polyline>
              <polyline points="20 10 14 10 14 4"></polyline>
              <line x1="14" y1="10" x2="21" y2="3"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          </button>
        </div>
        <div id="preview" class="preview"></div>
      </section>
    </main>
    
    <footer class="footer">
      <p>Created by <a href="https://sabidzpro.is-a.dev" target="_blank">Saiful Abidin</a></p>
    </footer>
  </div>

  <!-- Main JavaScript -->
  <script src="script.js"></script>
</body>
</html>
