<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Machine | Saiful Abidin</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="quote-app">
    <header class="app-header">
      <a href="../index.html" class="nav-back-btn">
        <i class="fas fa-arrow-left"></i> Hub
      </a>
      <span class="app-badge">FCC Project</span>
      <a href="https://codepen.io/saifulabidin/pen/ZYYoGNB" target="_blank" rel="noopener noreferrer" class="nav-code-btn">
        <i class="fab fa-codepen"></i> Code
      </a>
    </header>

    <h1 class="app-title">Random Quote Machine</h1>

    <main id="quote-box">
      <span class="quote-badge">
        <i class="fas fa-quote-left"></i> Daily Wisdom
      </span>
      
      <div class="quote-content">
        <div id="text"></div>
        <div id="author"></div>
      </div>
      
      <div class="buttons">
        <a id="tweet-quote" href="#" target="_blank" rel="noopener noreferrer" aria-label="Tweet this quote">
          <i class="fab fa-twitter"></i> Tweet
        </a>
        <button id="new-quote" aria-label="Get new quote">
          <i class="fas fa-sync-alt"></i> New Quote
        </button>
      </div>
    </main>

    <footer class="footer">
      <p>Created by <a href="https://sabidzpro.is-a.dev" target="_blank">Saiful Abidin</a></p>
    </footer>
  </div>

  <!-- Main Script -->
  <script src="script.js"></script>
</body>
</html>
